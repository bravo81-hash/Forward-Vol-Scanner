# Sector valuation multiples for the Value Entry Put Scanner.
#
# (pe_bull, pe_bear, ev_ebitda_bull, ev_ebitda_bear) per sector. These are a
# judgement about where a sector deserves to trade, not a market observation,
# so they go stale silently through a re-rating. `last_reviewed` is surfaced
# on every card the scanner produces, which is the point: a fair value built
# on a two-year-old multiple should say so on its face.
#
# Sector names must match the provider's sector strings exactly; an
# unrecognised sector falls back to default_multiples.

last_reviewed: 2026-08-15

default_multiples: {pe_bull: 18.0, pe_bear: 12.0, ev_ebitda_bull: 17.0, ev_ebitda_bear: 12.0}

